[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hotpulse"
version = "0.1.0"
description = "Self-hosted AI news radar: collects sources, scores with a local LLM (Ollama), groups stories into events, ranks by heat and publishes multilingual daily digests."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "httpx>=0.27",
  "feedparser>=6.0",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
extract = ["trafilatura>=1.8"]
dev = ["pytest>=8"]

[project.scripts]
hotpulse = "hotpulse.cli:main"

[tool.setuptools.packages.find]
include = ["hotpulse*"]

[tool.setuptools.package-data]
hotpulse = ["web/templates/*.html", "web/templates/admin/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
